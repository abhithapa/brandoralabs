# Local stack: PostgreSQL, the web app and the notification worker.
#   docker compose up --build
# Uses the `log` email transport — nothing is actually sent.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brandora_dev
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: tools }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &app-env
      APP_ENV: development
      SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/brandora_dev
      RATE_LIMIT_SECRET: local-development-secret-not-for-production-use
      EMAIL_TRANSPORT: log
      LEAD_NOTIFICATION_RECIPIENTS: leads@example.com
      TRUSTED_PROXY_HOPS: "0"
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: tools }
    command: ["npm", "run", "notifications:process", "--", "--watch"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  db-data:
