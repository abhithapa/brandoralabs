name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_readiness:
        description: "Also run the production launch check"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brandora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      SITE_URL: http://localhost:3100
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brandora_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brandora_test
      RATE_LIMIT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      EMAIL_TRANSPORT: log
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      - name: Check migrations match the schema (drift)
        # The database now reflects the committed migrations. Any difference from
        # schema.prisma means a migration is missing or was edited by hand incorrectly.
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  launch-check:
    # Run before promoting to production. Fails while any launch input is missing.
    if: github.event_name == 'workflow_dispatch' && inputs.production_readiness
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run launch:check
